name: validate

on:
  push:
  pull_request:

jobs:
  quick-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python run_analysis.py
      - run: python -m unittest discover -s tests -v
      - run: node --check scripts/download_dssr_full_inputs_v1.js
      - run: node --check scripts/search_rcsb_8og_independent_structures_v1.js
      - run: python scripts/build_final_notebook.py
      - run: python scripts/execute_notebook_stdlib.py
      - run: git diff --exit-code -- notebooks/final_signed_six_reproduction.ipynb
      - run: python scripts/preflight_publication.py
